[build]
  publish = "."
  functions = "netlify/functions"
[[redirects]]
  from = "/api-test"
  to = "/.netlify/functions/jsonbin-proxy"
  status = 200

# API 重定向规则 - 必须放在前面
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true  # 强制应用此规则

# 单页应用回退规则 - 必须放在最后
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200